<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · Tridatum</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/css/base.css?v=20260827b">
<style>
/* 관리자 전용 화면 — 사이트 토큰(base.css)만 빌려 쓰는 독립 레이아웃 */
body{background:var(--bg)}
.adm{max-width:860px;margin:0 auto;padding:32px 24px 80px}
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.adm-top .ttl{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.adm-top .ttl svg{width:26px;height:26px}
.adm-top .who{font-size:13px;color:var(--ink-45)}
.adm-tabs{display:inline-flex;gap:2px;background:#EFEBE3;border-radius:999px;padding:5px;margin-bottom:24px}
.adm-tabs button{
  border:none;background:transparent;border-radius:999px;padding:9px 18px;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-70);cursor:pointer;
}
.adm-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,34,51,.1)}
.pane{display:none}
.pane.on{display:block}
.hint{font-size:13px;color:var(--ink-45);margin-bottom:20px}
.acard{background:#F4F2EE;border-radius:16px;padding:20px;margin-bottom:14px}
.acard label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-70);margin-bottom:12px}
.acard input,.acard textarea{
  display:block;width:100%;margin-top:5px;box-sizing:border-box;
  border:none;background:#fff;border-radius:10px;padding:10px 13px;
  font-family:inherit;font-size:14px;color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(15,34,51,.06);
}
.acard input:focus,.acard textarea:focus{outline:none;box-shadow:inset 0 0 0 1.5px rgba(15,34,51,.35)}
.acard textarea{resize:vertical}
.arow{display:grid;grid-template-columns:1fr 170px;gap:12px}
.abar{display:flex;align-items:center;gap:14px;margin-top:20px}
.abtn{
  border:none;border-radius:999px;padding:11px 22px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:600;
  background:var(--ink);color:#fff;
}
.abtn.sub{background:#EFEBE3;color:var(--ink-70);padding:8px 16px;font-size:13px}
.abtn.danger{background:none;color:#B4432E;padding:8px 10px;font-size:13px}
.abtn:disabled{opacity:.5;cursor:default}
#adm-status{font-size:13.5px;color:var(--ink-70)}
.inq{background:#F4F2EE;border-radius:16px;padding:18px 20px;margin-bottom:12px}
.inq .m{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-45)}
.inq .m b{font-size:15px;color:var(--ink)}
.inq p{margin-top:10px;font-size:14px;color:var(--ink-70);white-space:pre-wrap}
.empty{font-size:14px;color:var(--ink-45);padding:24px 4px}
#adm-error{display:none;background:#FBEFEA;color:#8A3B26;border-radius:14px;padding:16px 18px;font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<div class="adm">
  <div class="adm-top">
    <div class="ttl">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#1B1A17"/><rect x="13" y="19" width="5.5" height="16" rx="2.75" fill="#FDFCFA"/><rect x="21.25" y="12.5" width="5.5" height="22.5" rx="2.75" fill="#FDFCFA"/><rect x="29.5" y="24.5" width="5.5" height="10.5" rx="2.75" fill="#B05C33"/></svg>
      관리자
    </div>
    <div class="who" id="adm-who"></div>
  </div>

  <div id="adm-error"></div>

  <div class="adm-tabs" role="tablist">
    <button class="on" data-pane="copy">문구 수정</button>
    <button data-pane="inq">문의함</button>
  </div>

  <div class="pane on" id="pane-copy">
    <p class="hint">홈페이지에 노출되는 주요 문구입니다. 저장하면 GitHub에 기록되고, 다음 배포 때 반영됩니다.</p>
    <div id="copy-editor"></div>
    <div class="abar">
      <button class="abtn" id="copy-save" type="button">문구 저장</button>
    </div>
  </div>

  <div class="pane" id="pane-inq">
    <p class="hint">홈페이지 문의 폼으로 들어온 내용입니다. 저장소가 아닌 별도 저장소에 보관됩니다.</p>
    <div id="inq-list"></div>
  </div>

  <div class="abar"><span id="adm-status" role="status"></span></div>
</div>
<script src="admin.js?v=20260827b"></script>
</body>
</html>
